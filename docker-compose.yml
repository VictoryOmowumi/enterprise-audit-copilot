services:
  db:
    image: pgvector/pgvector:pg16
    container_name: audit_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-audit_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-audit_admin_password}
      POSTGRES_DB: ${POSTGRES_DB:-audit_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-audit_admin} -d ${POSTGRES_DB:-audit_db}"]
      interval: 3s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: audit_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: audit_api
    restart: always
    environment:
      DATABASE_URL: postgresql://audit_admin:audit_admin_password@db:5432/audit_db
      REDIS_URL: redis://redis:6379/0
      PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: audit_worker
    restart: always
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql://audit_admin:audit_admin_password@db:5432/audit_db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend/app:/app/app
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata: